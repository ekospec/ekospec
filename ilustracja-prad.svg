<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t">
<title id="t">Tani prąd – licznik energii elektrycznej ze spadkiem kosztów</title>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#4e8ecb" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#c8a96e"/>
  </marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#4e8ecb"/>
  </marker>

  <style>
    .ln{fill:none;stroke:#4e8ecb;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .ln2{fill:none;stroke:#4e8ecb;stroke-opacity:.5;stroke-width:1.5;stroke-linejoin:round}
    .thin{fill:none;stroke:#4e8ecb;stroke-opacity:.3;stroke-width:1}
    .gold{fill:none;stroke:#c8a96e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .dim{fill:none;stroke:#7a8aa0;stroke-width:1.2}
    .dev{fill:#0b0f1e;stroke:#4e8ecb;stroke-width:2.5}
    .txt{font-family:'Rajdhani','Arial Narrow',Arial,sans-serif;font-size:15px;letter-spacing:3px;fill:#7a8aa0;font-weight:600}
    .tag{font-family:'Rajdhani','Arial Narrow',Arial,sans-serif;font-size:13px;letter-spacing:1.5px;fill:#7a8aa0;font-weight:700}
    .flow{fill:none;stroke:#c8a96e;stroke-width:3;stroke-linecap:round;stroke-dasharray:22 400;animation:flow 3.2s linear infinite}
    .flowb{fill:none;stroke:#8fbde8;stroke-width:3;stroke-linecap:round;stroke-dasharray:22 400;animation:flow 3.2s linear infinite}
    @keyframes flow{from{stroke-dashoffset:422}to{stroke-dashoffset:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}

    .case{fill:#101729;stroke:#4e8ecb;stroke-width:3}
    .lcd{fill:#0d1a24;stroke:#4e8ecb;stroke-opacity:.7;stroke-width:2}
    .seg{font-family:'Courier New',monospace;font-weight:700;fill:#c8a96e}
    .trend{fill:none;stroke:#c8a96e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2.2s .4s cubic-bezier(.16,1,.3,1) forwards,glow 3s 2.6s ease-in-out infinite}
    .tarea{fill:#c8a96e;fill-opacity:.1}
    .led{fill:#c8a96e;animation:blink 1.1s steps(2,end) infinite}
    .down{animation:bob 2.2s ease-in-out infinite}
    .coin{animation:pulse 3s ease-in-out infinite}
    .screw{fill:#0b0f1e;stroke:#4e8ecb;stroke-width:1.5}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}
    @keyframes blink{0%{opacity:1}100%{opacity:.15}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
    @media (prefers-reduced-motion:reduce){.trend{stroke-dashoffset:0}}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="800" height="1000" fill="#0b0f1e"/>
<rect width="800" height="1000" fill="url(#grid)"/>
<rect x="24" y="24" width="752" height="952" fill="none" stroke="#4e8ecb" stroke-opacity=".25"/>
<text class="txt" x="52" y="68">LICZNIK ENERGII</text>
<text class="txt" x="748" y="68" text-anchor="end">kWh</text>

<!-- obudowa -->
<rect class="case" x="220" y="170" width="360" height="660" rx="18"/>
<path d="M220 600H580" stroke="#4e8ecb" stroke-opacity=".5" stroke-width="2"/>
<circle class="screw" cx="250" cy="200" r="7"/><circle class="screw" cx="550" cy="200" r="7"/>
<path d="M246 200h8M546 200h8" stroke="#4e8ecb" stroke-width="1.5"/>
<!-- wyświetlacz -->
<rect class="lcd" x="270" y="250" width="260" height="200" rx="6"/>
<path class="tarea" d="M300 360 L330 352 L360 366 L390 380 L420 374 L450 392 L480 402 L510 398 L510 420 L300 420 Z"/>
<path class="trend" pathLength="400" d="M300 360 L330 352 L360 366 L390 380 L420 374 L450 392 L480 402 L510 398"/>
<circle cx="510" cy="398" r="5" fill="#c8a96e"/>
<text class="seg" x="290" y="300" style="font-size:22px">zł</text>
<g class="down">
  <path d="M470 280V318" stroke="#c8a96e" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
</g>
<path d="M290 430H510" stroke="#4e8ecb" stroke-opacity=".35" stroke-width="1"/>
<!-- dioda impulsowa i przyciski -->
<circle class="led" cx="300" cy="500" r="7"/>
<text class="tag" x="316" y="505">imp/kWh</text>
<rect x="440" y="486" width="36" height="28" rx="14" fill="none" stroke="#4e8ecb" stroke-width="2"/>
<rect x="490" y="486" width="36" height="28" rx="14" fill="none" stroke="#4e8ecb" stroke-width="2"/>
<!-- tabliczka znamionowa -->
<text class="tag" x="270" y="560">3 × 230/400 V</text>
<text class="tag" x="270" y="582">10(60) A · 50 Hz</text>
<text class="tag" x="530" y="560" text-anchor="end">kWh</text>
<!-- pokrywa zacisków -->
<rect x="250" y="630" width="300" height="80" rx="6" fill="none" stroke="#4e8ecb" stroke-opacity=".6" stroke-width="2"/>
<g fill="#0b0f1e" stroke="#4e8ecb" stroke-width="2">
  <rect x="270" y="650" width="24" height="40" rx="3"/><rect x="306" y="650" width="24" height="40" rx="3"/><rect x="342" y="650" width="24" height="40" rx="3"/><rect x="378" y="650" width="24" height="40" rx="3"/><rect x="414" y="650" width="24" height="40" rx="3"/><rect x="450" y="650" width="24" height="40" rx="3"/><rect x="486" y="650" width="24" height="40" rx="3"/><rect x="522" y="650" width="24" height="40" rx="3"/>
</g>
<circle class="screw" cx="290" cy="780" r="8"/><circle class="screw" cx="510" cy="780" r="8"/>
<rect x="430" y="742" width="2" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="435" y="742" width="1" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="440" y="742" width="3" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="445" y="742" width="1" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="450" y="742" width="2" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="455" y="742" width="1" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="460" y="742" width="1" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="465" y="742" width="3" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="470" y="742" width="2" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="475" y="742" width="1" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="480" y="742" width="2" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="485" y="742" width="3" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="490" y="742" width="1" height="30" fill="#7a8aa0" fill-opacity=".7"/><rect x="495" y="742" width="2" height="30" fill="#7a8aa0" fill-opacity=".7"/>
<!-- przewody -->
<g fill="none" stroke-width="3" stroke-linecap="round">
  <path d="M282 830V900" stroke="#4e8ecb"/><path d="M318 830V910" stroke="#4e8ecb" stroke-opacity=".7"/>
  <path d="M354 830V900" stroke="#4e8ecb" stroke-opacity=".5"/><path d="M390 830V910" stroke="#c8a96e"/>
  <path d="M426 830V900" stroke="#4e8ecb"/><path d="M462 830V910" stroke="#4e8ecb" stroke-opacity=".7"/>
  <path d="M498 830V900" stroke="#4e8ecb" stroke-opacity=".5"/><path d="M534 830V910" stroke="#c8a96e"/>
</g>
<!-- malejący stos monet -->
<g class="coin">
  <g fill="#0b0f1e" stroke="#c8a96e" stroke-width="2">
    <ellipse cx="660" cy="760" rx="42" ry="12"/><ellipse cx="660" cy="744" rx="42" ry="12"/><ellipse cx="660" cy="728" rx="42" ry="12"/>
  </g>
  <g fill="none" stroke="#c8a96e" stroke-opacity=".3" stroke-width="2" stroke-dasharray="5 6">
    <ellipse cx="660" cy="712" rx="42" ry="12"/><ellipse cx="660" cy="696" rx="42" ry="12"/><ellipse cx="660" cy="680" rx="42" ry="12"/>
  </g>
</g>
<g class="coin" style="animation-delay:-1.5s">
  <g fill="#0b0f1e" stroke="#4e8ecb" stroke-opacity=".5" stroke-width="2">
    <ellipse cx="120" cy="760" rx="42" ry="12"/><ellipse cx="120" cy="744" rx="42" ry="12"/><ellipse cx="120" cy="728" rx="42" ry="12"/>
    <ellipse cx="120" cy="712" rx="42" ry="12"/><ellipse cx="120" cy="696" rx="42" ry="12"/><ellipse cx="120" cy="680" rx="42" ry="12"/>
  </g>
</g>

<path d="M440 948V976M440 948H776" stroke="#4e8ecb" stroke-opacity=".25" fill="none"/>
<text class="txt" x="756" y="967" text-anchor="end" style="font-size:12px;letter-spacing:2px">EKOSPEC · TANI PRĄD</text>
</svg>
