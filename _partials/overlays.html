<!-- COOKIE BANNER -->
<div id="cookie-banner">
  <div class="cookie-text">
    <h4>PLIKI COOKIES</h4>
    <p>Ta strona używa plików cookies w celu zapewnienia prawidłowego funkcjonowania i analizy ruchu. Klikając „Akceptuję" wyrażasz zgodę na ich stosowanie. <a href="#" onclick="openLegal('privacy');return false;">Polityka prywatności</a></p>
  </div>
  <div class="cookie-btns">
    <button class="cookie-accept" onclick="acceptCookies()">Akceptuję</button>
    <button class="cookie-reject" onclick="rejectCookies()">Tylko niezbędne</button>
  </div>
</div>

<!-- MODAL PRAWNY -->
<div id="legal-modal" onclick="closeLegalBg(event)">
  <div class="lm-box">
    <div class="lm-header">
      <h3 id="lm-title">Polityka prywatności</h3>
      <button class="lm-close" onclick="closeLegal()">&#x2715;</button>
    </div>
    <div class="lm-body" id="lm-body"></div>
  </div>
</div>

<!-- MODAL OFERTY (PC) -->
<div id="service-modal" onclick="closeServiceModalBg(event)">
  <button class="sm-close" onclick="closeServiceModal()">&#x2715;</button>
  <div class="sm-box">
    <div class="sm-text">
      <div class="sm-eyebrow"><span id="sm-number"></span></div>
      <h3 id="sm-title"></h3>
      <div class="sm-divider"></div>
      <div id="sm-content"></div>
    </div>
    <div class="sm-img-wrap">
      <img id="sm-img" src="" alt=""/>
    </div>
  </div>
</div>
    
<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightboxBg(event)">
  <button class="lb-close" onclick="closeLightbox()">&#x2715;</button>
  <button class="lb-prev" onclick="lbNav(-1)">&#8249;</button>
  <button class="lb-next" onclick="lbNav(1)">&#8250;</button>
  <div class="lb-inner">
    <div class="lb-img-wrap"><img id="lb-img" src="" alt=""/></div>
    <div class="lb-caption">
      <strong id="lb-title"></strong>
      <p id="lb-desc"></p>
    </div>
  </div>
</div>
