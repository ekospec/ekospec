    .th{fill:none;stroke:#4e8ecb;stroke-width:1.5}
    .coil{fill:none;stroke:#c8a96e;stroke-width:2.5}
    .man{fill:#c8a96e;fill-opacity:.12;stroke:#c8a96e;stroke-width:2}
    .manb{fill:#4e8ecb;fill-opacity:.12;stroke:#4e8ecb;stroke-width:2}
    .flame{animation:pulse 1.8s ease-in-out infinite}
    .heat{animation:pulse 4s ease-in-out infinite}
    .fan{animation:spin 2.6s linear infinite;transform-origin:130px 485px}
    .flow,.flowb{stroke-width:3.5}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
