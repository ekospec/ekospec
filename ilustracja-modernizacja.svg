<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t">
<title id="t">Planowanie modernizacji – kotłownia przed i po modernizacji</title>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#4e8ecb" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#c8a96e"/>
  </marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#4e8ecb"/>
  </marker>

  <style>
    .ln{fill:none;stroke:#4e8ecb;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .ln2{fill:none;stroke:#4e8ecb;stroke-opacity:.5;stroke-width:1.5;stroke-linejoin:round}
    .thin{fill:none;stroke:#4e8ecb;stroke-opacity:.3;stroke-width:1}
    .gold{fill:none;stroke:#c8a96e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .dim{fill:none;stroke:#7a8aa0;stroke-width:1.2}
    .dev{fill:#0b0f1e;stroke:#4e8ecb;stroke-width:2.5}
    .txt{font-family:'Rajdhani','Arial Narrow',Arial,sans-serif;font-size:15px;letter-spacing:3px;fill:#7a8aa0;font-weight:600}
    .tag{font-family:'Rajdhani','Arial Narrow',Arial,sans-serif;font-size:13px;letter-spacing:1.5px;fill:#7a8aa0;font-weight:700}
    .flow{fill:none;stroke:#c8a96e;stroke-width:3;stroke-linecap:round;stroke-dasharray:22 400;animation:flow 3.2s linear infinite}
    .flowb{fill:none;stroke:#8fbde8;stroke-width:3;stroke-linecap:round;stroke-dasharray:22 400;animation:flow 3.2s linear infinite}
    @keyframes flow{from{stroke-dashoffset:422}to{stroke-dashoffset:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}

    .old{fill:none;stroke:#7a8aa0;stroke-opacity:.55;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
    .oldf{fill:#7a8aa0;fill-opacity:.12;stroke:#7a8aa0;stroke-opacity:.55;stroke-width:2.5}
    .smoke{fill:none;stroke:#7a8aa0;stroke-opacity:.35;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 8;animation:up 2.4s linear infinite}
    .waste{fill:none;stroke:#7a8aa0;stroke-opacity:.45;stroke-width:2;stroke-linecap:round;animation:pulse 2.6s ease-in-out infinite}
    .w2{animation-delay:-.9s}.w3{animation-delay:-1.7s}
    .arrowc{animation:pulse 2.4s ease-in-out infinite}
    .fan{animation:spin 3s linear infinite;transform-origin:610px 470px}
    .ok{animation:pulse 3s ease-in-out infinite}
    @keyframes up{to{stroke-dashoffset:-28}}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="800" height="1000" fill="#0b0f1e"/>
<rect width="800" height="1000" fill="url(#grid)"/>
<rect x="24" y="24" width="752" height="952" fill="none" stroke="#4e8ecb" stroke-opacity=".25"/>
<text class="txt" x="52" y="68">MODERNIZACJA</text>
<text class="txt" x="748" y="68" text-anchor="end">PRZED → PO</text>

<!-- podział -->
<path d="M400 120V880" stroke="#4e8ecb" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="8 8"/>
<text class="txt" x="200" y="140" text-anchor="middle">PRZED</text>
<text class="txt" x="600" y="140" text-anchor="middle" style="fill:#c8a96e">PO</text>

<!-- ===== PRZED: stary kocioł ===== -->
<path class="old" d="M170 330V210H210V330"/>
<path class="smoke" d="M190 200C180 180 200 165 188 145"/>
<path class="smoke" d="M200 205C212 186 194 170 206 150" style="animation-delay:-1.2s"/>
<rect class="oldf" x="90" y="330" width="200" height="300" rx="6"/>
<rect class="old" x="115" y="360" width="150" height="70"/>
<path d="M175 610c-18-18-12-40 5-58c3 18 16 22 18 36c10-8 10-22 6-32c16 14 20 38 4 54z" fill="#7a8aa0" fill-opacity=".35"/>
<rect class="old" x="130" y="520" width="120" height="20"/>
<!-- manometr w czerwonej strefie -->
<circle class="old" cx="160" cy="395" r="24"/>
<path d="M160 395L176 380" stroke="#b86a5a" stroke-width="3" stroke-linecap="round"/>
<path d="M140 408A24 24 0 0 1 182 380" fill="none" stroke="#b86a5a" stroke-opacity=".55" stroke-width="3"/>
<circle class="old" cx="230" cy="395" r="12"/>
<!-- plątanina rur -->
<path class="old" d="M120 630V680H80V760H150V710H200V800H120V850H250"/>
<path class="old" d="M250 630V700H300V660H340V760H280V820H340V860"/>
<path class="old" d="M190 630V665H230V740H175"/>
<!-- straty -->
<path class="waste" d="M300 380c14-8 8-20 22-28"/>
<path class="waste w2" d="M300 440c14-8 8-20 22-28"/>
<path class="waste w3" d="M300 500c14-8 8-20 22-28"/>
<path class="waste w2" d="M60 420c-12-8-6-20-18-28"/>
<path class="waste" d="M60 480c-12-8-6-20-18-28"/>

<!-- strzałka -->
<g class="arrowc">
  <circle cx="400" cy="500" r="34" fill="#0b0f1e" stroke="#c8a96e" stroke-width="2.5"/>
  <path d="M384 500H414M404 489L415 500L404 511" fill="none" stroke="#c8a96e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- ===== PO: nowoczesna kotłownia ===== -->
<rect class="dev" x="510" y="380" width="200" height="190" rx="10"/>
<circle cx="610" cy="470" r="56" fill="none" stroke="#4e8ecb" stroke-opacity=".6" stroke-width="2"/>
<g class="fan">
  <path d="M610 470C598 446 600 424 610 418C624 426 624 450 610 470Z" fill="#c8a96e"/>
  <path d="M610 470C636 468 656 478 658 490C646 500 624 488 610 470Z" fill="#c8a96e"/>
  <path d="M610 470C596 492 576 504 566 496C566 480 588 470 610 470Z" fill="#c8a96e"/>
  <circle cx="610" cy="470" r="7" fill="#0b0f1e" stroke="#c8a96e" stroke-width="2"/>
</g>
<g class="ln2"><path d="M530 395H690M530 555H690"/></g>
<!-- zasobnik / bufor -->
<rect class="dev" x="540" y="650" width="120" height="200" rx="60"/>
<path class="ln2" d="M540 700H660M540 800H660"/>
<!-- manometr w normie -->
<circle class="dev" cx="700" cy="640" r="22"/>
<path d="M700 640L688 626" stroke="#c8a96e" stroke-width="3" stroke-linecap="round"/>
<path d="M680 652A22 22 0 0 1 690 622" fill="none" stroke="#c8a96e" stroke-opacity=".6" stroke-width="3"/>
<!-- rury: zasilanie złote, powrót niebieski -->
<path class="gold" d="M560 570V650"/>
<path class="ln" d="M660 570V610H700V618"/>
<path class="gold" d="M540 700H480V880"/>
<path class="ln" d="M660 800H720V880"/>
<path class="flow" pathLength="422" d="M560 570V650"/>
<path class="flow" pathLength="422" d="M540 700H480V880" style="animation-delay:-1.1s"/>
<path class="flowb" pathLength="422" d="M720 880V800H660" style="animation-delay:-2s"/>
<!-- znaczek sprawności -->
<g class="ok">
  <circle cx="690" cy="330" r="22" fill="none" stroke="#c8a96e" stroke-width="2"/>
  <path d="M680 330L688 338L702 322" fill="none" stroke="#c8a96e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<path d="M440 948V976M440 948H776" stroke="#4e8ecb" stroke-opacity=".25" fill="none"/>
<text class="txt" x="756" y="967" text-anchor="end" style="font-size:12px;letter-spacing:2px">EKOSPEC · PLANOWANIE MODERNIZACJI</text>
</svg>
