<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t">
<title id="t">Automatyka budynkowa – sterownik połączony z czujnikami i urządzeniami</title>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#4e8ecb" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4e8ecb" stop-opacity=".28"/>
    <stop offset=".6" stop-color="#4e8ecb" stop-opacity=".06"/>
    <stop offset="1" stop-color="#4e8ecb" stop-opacity="0"/>
  </radialGradient>
  <style>
    .ln{fill:none;stroke:#4e8ecb;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .ln2{fill:none;stroke:#4e8ecb;stroke-opacity:.5;stroke-width:1.5}
    .bus{fill:none;stroke:#4e8ecb;stroke-opacity:.28;stroke-width:2}
    .pulse{fill:none;stroke:#c8a96e;stroke-width:3;stroke-linecap:round;stroke-dasharray:26 400;animation:data 3s linear infinite}
    .p2{animation-delay:-.5s}.p3{animation-delay:-1s}.p4{animation-delay:-1.5s}.p5{animation-delay:-2s}.p6{animation-delay:-2.5s}
    .dev{fill:#0b0f1e;stroke:#4e8ecb;stroke-width:2.5}
    .gold{fill:none;stroke:#c8a96e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .txt{font-family:'Rajdhani','Arial Narrow',Arial,sans-serif;font-size:15px;letter-spacing:3px;fill:#7a8aa0;font-weight:600}
    .led{animation:blink 1.4s steps(2,end) infinite}
    .l2{animation-delay:-.35s}.l3{animation-delay:-.7s}.l4{animation-delay:-1.05s}
    .fan{animation:spin 2.4s linear infinite;transform-origin:650px 300px}
    .core{animation:breath 4s ease-in-out infinite;transform-origin:400px 520px}
    .bar{animation:bars 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
    .b2{animation-delay:-.7s}.b3{animation-delay:-1.4s}.b4{animation-delay:-2.1s}
    @keyframes data{from{stroke-dashoffset:426}to{stroke-dashoffset:0}}
    @keyframes blink{0%{opacity:1}100%{opacity:.2}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes breath{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
    @keyframes bars{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.pulse,.led,.fan,.core,.bar{animation:none}}
  </style>
</defs>
<rect width="800" height="1000" fill="#0b0f1e"/>
<rect width="800" height="1000" fill="url(#grid)"/>
<rect x="24" y="24" width="752" height="952" fill="none" stroke="#4e8ecb" stroke-opacity=".25"/>
<text class="txt" x="52" y="68">SCHEMAT STEROWANIA</text>
<text class="txt" x="748" y="68" text-anchor="end">BMS</text>

<circle class="core" cx="400" cy="520" r="230" fill="url(#core)"/>

<!-- magistrale -->
<g class="bus">
  <path id="b1" d="M400 440V250"/>
  <path id="b2" d="M290 480H200Q180 480 180 460V350"/>
  <path id="b3" d="M510 480H600Q620 480 620 460V360"/>
  <path id="b4" d="M290 560H200Q180 560 180 580V690"/>
  <path id="b5" d="M510 560H600Q620 560 620 580V690"/>
  <path id="b6" d="M400 600V790"/>
</g>
<g>
  <path class="pulse" pathLength="426" d="M400 440V250"/>
  <path class="pulse p2" pathLength="426" d="M290 480H200Q180 480 180 460V350"/>
  <path class="pulse p3" pathLength="426" d="M510 480H600Q620 480 620 460V360"/>
  <path class="pulse p4" pathLength="426" d="M290 560H200Q180 560 180 580V690"/>
  <path class="pulse p5" pathLength="426" d="M510 560H600Q620 560 620 580V690"/>
  <path class="pulse p6" pathLength="426" d="M400 600V790"/>
</g>

<!-- sterownik -->
<rect class="dev" x="290" y="440" width="220" height="160" rx="4"/>
<g class="ln2">
  <rect x="306" y="456" width="36" height="128"/><rect x="350" y="456" width="36" height="128"/>
  <rect x="394" y="456" width="36" height="128"/><rect x="438" y="456" width="56" height="128"/>
</g>
<g fill="#c8a96e">
  <circle class="led" cx="324" cy="474" r="4"/><circle class="led l2" cx="368" cy="474" r="4"/>
  <circle class="led l3" cx="412" cy="474" r="4"/><circle class="led l4" cx="466" cy="474" r="4"/>
</g>
<g fill="#4e8ecb" fill-opacity=".5">
  <rect x="314" y="500" width="20" height="4"/><rect x="314" y="512" width="20" height="4"/><rect x="314" y="524" width="20" height="4"/>
  <rect x="358" y="500" width="20" height="4"/><rect x="358" y="512" width="20" height="4"/><rect x="358" y="524" width="20" height="4"/>
  <rect x="402" y="500" width="20" height="4"/><rect x="402" y="512" width="20" height="4"/><rect x="402" y="524" width="20" height="4"/>
  <rect x="448" y="500" width="36" height="24"/>
</g>

<!-- panel (góra) -->
<rect class="dev" x="330" y="150" width="140" height="100" rx="4"/>
<rect x="344" y="164" width="112" height="66" fill="none" stroke="#4e8ecb" stroke-opacity=".5"/>
<g fill="#c8a96e">
  <rect class="bar" x="356" y="194" width="14" height="28"/>
  <rect class="bar b2" x="378" y="184" width="14" height="38"/>
  <rect class="bar b3" x="400" y="200" width="14" height="22"/>
  <rect class="bar b4" x="422" y="176" width="14" height="46"/>
</g>

<!-- czujnik temperatury (lewo góra) -->
<circle class="dev" cx="180" cy="300" r="50"/>
<path class="gold" d="M172 318V272a8 8 0 0116 0v46"/>
<circle cx="180" cy="326" r="13" fill="none" stroke="#c8a96e" stroke-width="2.5"/>
<circle cx="180" cy="326" r="6" fill="#c8a96e"/>
<path d="M180 318V290" stroke="#c8a96e" stroke-width="4" stroke-linecap="round"/>

<!-- wentylator (prawo góra) -->
<circle class="dev" cx="650" cy="300" r="50"/>
<g class="fan">
  <path d="M650 300C640 280 642 262 650 256C662 262 662 282 650 300Z" fill="#c8a96e"/>
  <path d="M650 300C672 298 688 306 690 316C680 326 662 316 650 300Z" fill="#c8a96e"/>
  <path d="M650 300C638 318 622 328 612 322C612 308 630 300 650 300Z" fill="#c8a96e"/>
  <circle cx="650" cy="300" r="6" fill="#0b0f1e" stroke="#c8a96e" stroke-width="2"/>
</g>

<!-- pompa (lewo dół) -->
<circle class="dev" cx="180" cy="740" r="50"/>
<circle cx="180" cy="740" r="26" fill="none" stroke="#c8a96e" stroke-width="2.5"/>
<path d="M168 724L196 740L168 756Z" fill="#c8a96e"/>

<!-- zawór (prawo dół) -->
<circle class="dev" cx="620" cy="740" r="50"/>
<path class="gold" d="M596 752L620 740L596 728ZM644 752L620 740L644 728Z" fill="#c8a96e" fill-opacity=".25"/>
<path class="gold" d="M620 740V716M608 716H632"/>

<!-- ogrzewanie (dół) -->
<rect class="dev" x="320" y="790" width="160" height="90" rx="4"/>
<g class="gold">
  <path d="M344 810v50M364 810v50M384 810v50M404 810v50M424 810v50M444 810v50M456 810v50"/>
  <path d="M338 866H462"/>
</g>

<path d="M440 948V976M440 948H776" stroke="#4e8ecb" stroke-opacity=".25" fill="none"/>
<text class="txt" x="756" y="967" text-anchor="end" style="font-size:12px;letter-spacing:2px">EKOSPEC · AUTOMATYKA BUDYNKOWA</text>
</svg>
